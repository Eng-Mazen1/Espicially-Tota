\<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Love Heart</title>
    <style>
        body { margin: 0; padding: 0; background-color: #060208; overflow: hidden; font-family: Arial; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 2, 8, 0.9); display: flex; justify-content: center;
            align-items: center; z-index: 10; cursor: pointer; color: #e60d2e;
            font-size: 24px; font-weight: bold; transition: opacity 0.5s;
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="overlay">اضغط هنا لتشغيل الأغنية والأنيميشن 🎵</div>
    <canvas id="canvas"></canvas>
    <audio id="bgMusic" src="song.mp3" loop></audio>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height, cx, cy;
        
        const SC = 22;
        const OY = 20;
        const GAP = 7;
        const SIZES = [9, 10, 11, 12];
        const BG = [6/255, 2/255, 8/255];
        const FLASH = [1.0, 0.78, 0.78];
        const LIFT = 34;
        const ANIM = 42;

        const PHRASES = [
            "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
            "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
            "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
            "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
            "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        function heart(a) {
            const x = 16 * Math.pow(Math.sin(a), 3);
            const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
            return [x * SC, y * SC + OY];
        }

        const POLY = [];
        for (let i = 0; i < 720; i++) POLY.push(heart(2 * Math.PI * i / 720));
        const YMAX = Math.max(...POLY.map(p => p[1]));
        const YMIN = Math.min(...POLY.map(p => p[1]));
        const CY = (YMAX + YMIN) / 2;

        const EDGES = [];
        for (let i = 0; i < POLY.length; i++) {
            EDGES.push([POLY[i], POLY[(i + 1) % POLY.length]]);
        }

        function spans(y) {
            let xs = [];
            for (let [[x1, y1], [x2, y2]] of EDGES) {
                if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
                    xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
                }
            }
            xs.sort((a, b) => a - b);
            let pairs = [];
            for (let i = 0; i < xs.length; i += 2) {
                if (xs[i + 1] !== undefined) pairs.push([xs[i], xs[i + 1]]);
            }
            return pairs;
        }

        function intersect(A, B) {
            let out = [];
            for (let a of A) {
                for (let b of B) {
                    let lo = Math.max(a[0], b[0]), hi = Math.min(a[1], b[1]);
                    if (hi - lo > 14) out.push([lo, hi]);
                }
            }
            return out;
        }

        function mix(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }
        function dim(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }
        function hx(c) { 
            const toHex = v => Math.floor(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0');
            return `#${toHex(c[0])}${toHex(c[1])}${toHex(c[2])}`;
        }
        function clamp(v) { return Math.max(0, Math.min(1, v)); }

        let activeItems = [];
        let itemsIter = 0;
        let mainIds = [];

        function build() {
            let placed = [];
            let row_h = 16;
            let half = row_h / 2;
            let y = YMAX - half;
            
            let cycleIdx = 0;
            const getPhrase = () => {
                let p = PHRASES[cycleIdx % PHRASES.length];
                cycleIdx++; return p;
            };
            PHRASES.sort(() => Math.random() - 0.5);

            while (y > YMIN + half) {
                let row = intersect(spans(y + half), spans(y - half));
                for (let [lo, hi] of row) {
                    lo += 4; hi -= 4;
                    let cur = lo + Math.random() * 8;
                    let line = [];
                    
                    while (true) {
                        let text = getPhrase();
                        let size = SIZES[Math.floor(Math.random() * SIZES.length)];
                        ctx.font = `bold ${size}px Arial`;
                        let w = ctx.measureText(text).width;
                        
                        if (cur + w <= hi) {
                            line.push({x: cur + w / 2, text, size, w});
                            cur += w + GAP;
                        } else {
                            break;
                        }
                    }
                    if (line.length === 0) continue;

                    if (line.length > 1) {
                        let left = hi - (line[line.length - 1].x + line[line.length - 1].w / 2);
                        for (let i = 0; i < line.length; i++) {
                            line[i].x += left * (i / (line.length - 1));
                        }
                    } else {
                        line[0].x = (lo + hi) / 2;
                    }

                    for (let i = 0; i < line.length; i++) {
                        let edge = (i === 0 || i === line.length - 1);
                        placed.push({...line[i], y, edge});
                    }
                }
                y -= row_h;
            }

            const wine = [0.58, 0.0, 0.09];
            const crimson = [0.90, 0.05, 0.14];
            const blood = [0.98, 0.10, 0.16];

            for (let p of placed) {
                let rad = Math.min(1.0, Math.hypot(p.x / (16 * SC), (p.y - CY) / (14.5 * SC)));
                let base = mix(wine, crimson, 0.25 + 0.75 * rad);
                base = mix(base, blood, Math.random() * 0.35 + (p.edge ? 0.3 : 0));
                p.color = base;
                p.rad = rad;
            }

            let edges = placed.filter(p => p.edge).sort((a, b) => (Math.atan2(a.x, a.y - CY) % (2 * Math.PI)) - (Math.atan2(b.x, b.y - CY) % (2 * Math.PI)));
            let inner = placed.filter(p => !p.edge).sort((a, b) => -a.rad + Math.random() * 0.08);
            
            return edges.concat(inner);
        }

        const ORDER = build();
        let frameCount = 0;
        let isSpawning = true;
        let RATE = ORDER.length / (10 * 60); 
        let acc = 0.0;

        function spawn(p) {
            p.f = 0;
            p.dx = (Math.random() - 0.5) * 20;
            p.stateColor = p.color;
            activeItems.push(p);
            mainIds.push(p);
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            if (isSpawning) {
                acc += RATE;
                while (acc >= 1 && itemsIter < ORDER.length) {
                    acc -= 1;
                    spawn(ORDER[itemsIter++]);
                }
                if (itemsIter >= ORDER.length) isSpawning = false;
            }

            // Shimmer effect
            if (!isSpawning && Math.random() < 0.1) {
                let rItem = mainIds[Math.floor(Math.random() * mainIds.length)];
                rItem.shimmer = 1.0;
            }

            for (let i = activeItems.length - 1; i >= 0; i--) {
                let p = activeItems[i];
                p.f += 1;
                let u = clamp(p.f / ANIM);
                let e = 1 - Math.pow(1 - u, 3);
                
                let hover = (1 - e) * LIFT;
                let px = cx + p.x + p.dx * (1 - e);
                let py = cy - p.y - hover;

                // Shadow
                ctx.font = `bold ${p.size}px Arial`;
                ctx.fillStyle = hx(mix(BG, dim(p.color, 0.30), e));
                ctx.fillText(p.text, px + 2, py + 3);

                // Halo
                ctx.font = `bold ${p.size + 1}px Arial`;
                ctx.fillStyle = hx(mix(BG, dim(p.color, 0.20), e * e));
                ctx.fillText(p.text, px, py);

                // Main
                let flash = 0.75 * Math.sin(Math.PI * clamp((u - 0.55) / 0.45));
                let col = mix(mix(BG, p.color, Math.pow(e, 1.5)), FLASH, flash);
                
                ctx.font = `bold ${p.size}px Arial`;
                ctx.fillStyle = hx(col);
                ctx.fillText(p.text, px, py);

                if (u >= 1) activeItems.splice(i, 1);
            }

            // Draw settled items
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            for (let p of mainIds) {
                if (p.f >= ANIM) {
                    let col = p.color;
                    if (p.shimmer > 0) {
                        col = mix(p.color, FLASH, p.shimmer * 0.6);
                        p.shimmer -= 0.05;
                    }
                    ctx.font = `bold ${p.size}px Arial`;
                    ctx.fillStyle = hx(col);
                    ctx.fillText(p.text, cx + p.x, cy - p.y);
                }
            }

            requestAnimationFrame(draw);
        }

        document.getElementById('overlay').addEventListener('click', function() {
            this.style.opacity = '0';
            setTimeout(() => this.style.display = 'none', 500);
            document.getElementById('bgMusic').play().catch(() => {});
            draw();
        });
    </script>
</body>
</html>
